name: CI

# DShop 此前无任何 CI 配置：三个质量闸门（typecheck / test / lint）只能人工执行，
# 而契约冻结后 DShop 是 PiEcho 的上游数据源，回归成本高。
#
# 说明：本工作流只跑**离线**闸门。D1 迁移与 staging 部署（db:migrate:staging /
# seed:cs:staging）需要 Cloudflare 凭据，不在 CI 中运行。

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: 类型检查 / 单测 / 静态检查
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 检出
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查（turbo run typecheck）
        run: npm run typecheck

      - name: 单元测试（turbo run test）
        run: npm test

      - name: 静态检查（turbo run lint）
        run: npm run lint

      # 前端构建（apps/storefront、apps/admin）：验证 Vite 产物可生成。
      # 无 build script 的 workspace 会被 turbo 跳过，因此该步骤对新 app 是增量的。
      - name: 前端构建（turbo run build）
        run: npm run build

      # 契约自检：校验 OpenAPI 与字段契约一致（scripts/check.ts），
      # 自动发现 apps/*、packages/* 下的全部工作区并逐个跑 typecheck + test。
      - name: 契约自检
        run: npm run check

      # 种子 SQL 与 JSON 同步守卫：
      # `data/seed-cs/seed_cs.sql` 是 `scripts/build-seed-sql.ts` 由 JSON 生成的产物。
      # 若改了 JSON（含图片的 gen:png? 指令）却忘记重新生成，CI 必须失败——
      # 否则仓库里会同时存在「新 JSON + 旧 SQL」，本地 D1 灌进去的是过期数据。
      # `git diff --exit-code` 在无差异时返回 0，有差异时返回 1。
      - name: 种子 SQL 与 JSON 同步（重新生成后必须无差异）
        run: |
          npm run seed:sql
          git diff --exit-code -- data/seed-cs/seed_cs.sql

      # C 端全链路验收（`--skip-chat`，纯 DShop 侧）：
      # 真实 Chrome（零依赖 CDP）走「短信登录 → 加购 → 结算 → 下单」，
      # 再断言 C 端与 Agent 面两侧的状态一致性（R26 的 itemCount/itemSummary、
      # R27 的未支付订单子单状态）。**不含客服对话腿**——那条腿依赖真实模型端点，
      # 且需要 PiEcho 仓库，二者 CI 都没有，故本步只用 `--skip-chat`。
      #
      # 前置数据：本地 D1 需先迁移 + 灌种子（`db:migrate:local` / `seed:cs:local`
      # 走 `--local`，**不需要 CLOUDFLARE_API_TOKEN**）。
      # `.dev.vars` 被 gitignore，故从已入库的 `.dev.vars.example` 复制——
      # 脚本读 `AGENT_TOKEN_PEPPER` 签临时服务令牌，用示例值即可与 API 自洽。
      #
      # ubuntu-latest 预装 Google Chrome（`/usr/bin/google-chrome`，已在
      # CHROME_CANDIDATES 中；Linux 上自动加 `--no-sandbox`）。
      - name: C 端全链路验收（浏览器 + 两面一致性）
        continue-on-error: false
        env:
          NO_COLOR: "1"
        run: |
          cp apps/api/.dev.vars.example apps/api/.dev.vars
          npm run db:migrate:local
          npm run seed:cs:local
          npm run e2e:customer -- --skip-chat

      # 部署 dry-run：验证 apps/api 的 wrangler.jsonc 配置可构建出产物。
      # `--dry-run` 只做本地打包与配置校验，**不需要 CLOUDFLARE_API_TOKEN 凭据**，
      # 因此无需注入 secret 即可运行，也就**没有必要限制在 main 分支**——PR 上同样
      # 应该拦截配置错误（失败即阻断，continue-on-error: false）。
      #
      # `--env=""` 是**必需**的：wrangler.jsonc 现在含 `env`（preview/staging/
      # production）多环境段，不显式指定环境时 wrangler 会打印
      # "Multiple environments are defined… but no target environment was specified"
      # 警告。传空串明确表示「目标 = 顶层环境」。
      #
      # 下面逐个环境各跑一次：多环境段的绑定集合互不继承（wrangler 的 `env` 段
      # 不继承 `d1_databases`），只跑顶层会漏掉某个环境的配置损坏。
      - name: 部署 dry-run（apps/api · 顶层环境）
        continue-on-error: false
        working-directory: apps/api
        run: npx wrangler deploy --dry-run --env=""

      - name: 部署 dry-run（apps/api · 全部环境段）
        continue-on-error: false
        working-directory: apps/api
        run: |
          for env in preview staging production; do
            echo "::group::wrangler dry-run --env $env"
            npx wrangler deploy --dry-run --env "$env"
            echo "::endgroup::"
          done

      # 部署 dry-run：验证 apps/storefront 的 wrangler.jsonc 配置可构建出产物。
      # 前端产物由上面的 `npm run build` 步骤生成（dist/），此处只做打包与绑定校验。
      # 与 apps/api 不同，前端 wrangler.jsonc 无 `env` 多环境段，故不需要 `--env=""`。
      - name: 部署 dry-run（apps/storefront）
        continue-on-error: false
        working-directory: apps/storefront
        run: npx wrangler deploy --dry-run --config wrangler.jsonc

      - name: 部署 dry-run（apps/admin）
        continue-on-error: false
        working-directory: apps/admin
        run: npx wrangler deploy --dry-run --config wrangler.jsonc
